name: Aether MDT and Base Dispatch validation
on:
  push:
    branches: [feat/aether-mdt-bolo-base-radio]
  pull_request:
    paths:
      - 'src/services/cad/**'
      - 'src/commands/ERLC/**'
      - 'src/web/cad/**'
      - 'src/web/cadRouter.js'
      - 'test/mdt*.test.js'
      - 'package*.json'
      - '.github/workflows/mdt-v4-tests.yml'
permissions:
  contents: read
jobs:
  mdt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install dependencies from locked versions
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: JavaScript syntax
        run: |
          node --check src/services/cad/mdtCore.js
          node --check src/services/cad/mdtService.js
          node --check src/services/cad/baseStationService.js
          node --check src/commands/ERLC/modules/cadExtended.js
          node --check src/commands/ERLC/cad.js
          node --check src/commands/ERLC/911.js
          node --check src/web/cadRouter.js
          node --check src/web/cad/assets/mdt.js
          node --check src/web/cad/assets/map.js
          node --check src/web/cad/assets/app.js
      - name: CAD legacy regressions and new MDT tests
        run: node --test test/cad.test.js test/dispatch-core.test.js test/mdt-core.test.js test/mdt.test.js
      - name: Ensure the extended command is valid
        run: |
          node --input-type=module -e "import cmd from './src/commands/ERLC/cad.js'; const body = cmd.data.toJSON(); if(body.name !== 'cad') throw new Error('wrong command'); for (const group of ['mdt','bolo','base']) if(!body.options.find(o=>o.name===group && o.type===2)) throw new Error('missing group '+group); if(body.options.length>25) throw new Error('too many groups'); console.log('CAD command groups validated')"

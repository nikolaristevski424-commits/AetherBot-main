name: AdvertiseHERE validation
on:
  push:
    branches: [main, 'feat/advertisehere-*']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Clean install
        run: npm ci --ignore-scripts
      - name: Tests
        run: npm test
      - name: Syntax checks
        run: npm run check
      - name: Ensure old source is not active
        run: test ! -d src && test ! -d lavalink && test ! -d scripts

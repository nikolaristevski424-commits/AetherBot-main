name: Aether Portal and CAD v2 Tests

on:
  pull_request:
    paths:
      - 'src/app.js'
      - 'src/web/**'
      - 'src/commands/Core/botinfo.js'
      - 'test/cad-v2.test.js'
      - '.github/workflows/portal-cad-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/web/**'
      - 'test/cad-v2.test.js'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Syntax checks
        run: |
          node --check src/app.js
          node --check src/web/cadRouter.js
          node --check src/web/cadV2Router.js
          node --check src/web/cadV2Service.js
          node --check src/web/portal/site.js
          node --check src/web/portal/cad.js
          node --check src/commands/Core/botinfo.js
      - name: CAD v2 unit tests
        run: node --test test/cad-v2.test.js
      - name: Existing CAD regression tests
        run: node --test test/cad.test.js

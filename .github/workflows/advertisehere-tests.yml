name: AdvertiseHERE tests
on:
  push:
    branches: [main, feat/advertisehere-rebrand]
  pull_request:
    paths: ['advertisehere/**', 'package.json', 'README.md', '.env.example']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - run: node --test advertisehere/tests/core.test.js
      - run: node --check advertisehere/bot/index.js
      - run: |
          for f in advertisehere/site/api/*.js advertisehere/site/api/_lib/*.js advertisehere/site/api/auth/*.js advertisehere/site/assets/*.js; do node --check "$f"; done

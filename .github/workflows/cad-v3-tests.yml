name: Aether CAD v3 validation
on:
  push:
    branches: [feat/aether-cad-dispatch-map-v3]
  pull_request:
    paths:
      - 'src/services/cad/**'
      - 'src/commands/ERLC/cad.js'
      - 'src/commands/ERLC/911.js'
      - 'src/web/cad/**'
      - 'src/web/cadRouter.js'
      - 'test/cad.test.js'
      - 'test/dispatch-core.test.js'
      - '.github/workflows/cad-v3-tests.yml'
permissions:
  contents: read
jobs:
  cad-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Verify JavaScript syntax
        run: |
          node --check src/commands/ERLC/911.js
          node --check src/commands/ERLC/cad.js
          node --check src/services/cad/cadService.js
          node --check src/services/cad/dispatchCore.js
          node --check src/services/cad/cadTrackingService.js
          node --check src/web/cad/assets/app.js
          node --check src/web/cad/assets/map.js
          node --check src/web/cadRouter.js
      - name: Aether legacy CAD regression + v3 map/911 tests
        run: node --test test/cad.test.js test/dispatch-core.test.js
